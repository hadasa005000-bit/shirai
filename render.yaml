services:
  - type: web
    name: heichal-hanigun
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heichal-hanigun-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false

  - type: cron
    name: heichal-hanigun-bot
    runtime: node
    plan: free
    schedule: "0 6 * * *" # פעם ביום ב-06:00 UTC — אפשר לשנות
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heichal-hanigun-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false

databases:
  - name: heichal-hanigun-db
    plan: free
